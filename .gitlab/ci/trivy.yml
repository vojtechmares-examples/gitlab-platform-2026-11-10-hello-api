.trivy:
  image:
    name: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/aquasec/trivy:0.76.2
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy
    paths: [.trivycache/]

trivy:repository:
  extends: .trivy
  stage: security
  needs: []
  script:
    - trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --format json --output trivy-repository.json .
    - trivy convert --format table trivy-repository.json
    - trivy convert --severity CRITICAL --exit-code 1 --format table trivy-repository.json > /dev/null
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths: [trivy-repository.json]

trivy:image:
  extends: .trivy
  stage: package
  needs: [build-image]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-image.json "$CI_REGISTRY_IMAGE:$CI_PIPELINE_ID"
    - trivy convert --format table trivy-image.json
    - trivy convert --severity CRITICAL --exit-code 1 --format table trivy-image.json > /dev/null
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths: [trivy-image.json]